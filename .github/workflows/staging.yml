name: Staging Approval Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build and Test Maven Project
        run: mvn clean verify

  deploy-staging:
    needs: build-and-validate
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Deploy to Staging
        run: echo "Approval granted! Deploying to staging."
